name: build

on:
  push:
  workflow_dispatch:

jobs:
  lint:
    name: 静态检查（不需要 macOS）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 括号配平、头文件引用、声明与实现对应、给自家类发的 selector、C 函数声明与参数个数、中文串引号
      - name: 源码静态检查
        run: python tools/check_sources.py .

      # 证明检查器本身有效：故意注入 6 类错误，必须每一类都被抓出来
      - name: 检查器变异自测
        run: python tools/selftest_checker.py

      # 不需要 macOS：用假 xcrun 验证两个构建脚本的语法与成功/失败路径
      - name: 构建脚本自测
        run: bash tools/selftest_build_scripts.sh

  dylib:
    name: 编译 dylib（TrollStore + TrollFools）
    needs: lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # 先自检环境：如果这一步就报错，说明问题在 runner/SDK，而不是代码
      - name: 环境自检
        run: |
          set -x
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk iphoneos --find clang
          xcrun --sdk iphoneos clang --version

      # 编译日志同时写进 build-log.txt，失败也会作为 artifact 上传，方便定位
      - name: 编译 WXKit.dylib
        run: |
          set -o pipefail
          mkdir -p build
          bash scripts/build-dylib.sh 2>&1 | tee build-log.txt

      # 探针是次要产物，失败不影响主产物
      - name: 编译探针 WXKitProbe.dylib（失败可忽略）
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/build-probe.sh 2>&1 | tee -a build-log.txt

      # 有些注入流程（TrollFools 等）用 zip 导入，这里两种形式都给
      - name: 打包 zip 形式（便于某些注入工具导入）
        continue-on-error: true
        run: |
          cd build
          zip -q WXKitProbe.zip WXKitProbe.dylib || true
          zip -q WXKit.zip WXKit.dylib || true
          ls -la

      - name: ad-hoc 签名副本 + 依赖检查
        continue-on-error: true
        run: |
          cp build/WXKit.dylib build/WXKit-signed.dylib || true
          brew install ldid || true
          if command -v ldid >/dev/null 2>&1; then
            ldid -S build/WXKit-signed.dylib && echo "已生成签名副本" || echo "签名失败，保留未签名副本"
          else
            echo "环境里没有 ldid，保留未签名副本（TrollFools 自己会签名）"
          fi
          echo "== dylib 依赖（应当只有系统库） =="
          otool -L build/WXKit.dylib || true
          if otool -L build/WXKit.dylib 2>/dev/null | grep -Eiq 'substrate|ellekit|libhooker|libsubstitute'; then
            echo "::warning::dylib 链接了越狱专属库，TrollFools 下可能加载失败"
          fi

      - name: 结果汇总
        if: always()
        run: |
          echo "== build/ =="
          ls -la build/ 2>/dev/null || echo "(build 目录不存在)"
          if [ -f build/WXKitProbe.dylib ]; then
            echo "✅ 探针产物存在（先注它验证链路）"
          else
            echo "::warning::探针没有产出，请检查上面的日志"
          fi
          echo "== 编译日志尾部 =="
          tail -n 60 build-log.txt 2>/dev/null || echo "(没有日志)"

      # 无论成功失败都上传：失败时把 build-log.txt 发出来就能定位问题
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WXKit-artifacts
          if-no-files-found: ignore
          path: |
            build/*.dylib
            build/*.zip
            build-log.txt
